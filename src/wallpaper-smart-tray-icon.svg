<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" version="1.1" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E95420;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F06434;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="url(#grad1)" opacity="0.95"/>
  
  <!-- Mountain landscape (wallpaper concept) -->
  <path d="M 8 45 L 20 30 L 28 38 L 38 25 L 48 35 L 56 28 L 56 52 L 8 52 Z" 
        fill="#2C3E50" opacity="0.3"/>
  <path d="M 8 48 L 18 35 L 26 42 L 36 30 L 46 38 L 56 32 L 56 52 L 8 52 Z" 
        fill="#34495E" opacity="0.5"/>
  
  <!-- Sun/Moon (smart concept - day/night) -->
  <circle cx="48" cy="18" r="7" fill="url(#grad2)"/>
  <path d="M 48 8 L 48 12 M 48 24 L 48 28 M 58 18 L 54 18 M 38 18 L 42 18 
           M 54.5 11.5 L 51.5 14.5 M 44.5 21.5 L 41.5 24.5 
           M 54.5 24.5 L 51.5 21.5 M 44.5 14.5 L 41.5 11.5" 
        stroke="#FFD700" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Smart indicator (small gear) -->
  <g transform="translate(14, 14)">
    <circle cx="0" cy="0" r="5" fill="#ffffff" opacity="0.9"/>
    <path d="M 0,-3 L 1,-2 L 1,2 L 0,3 L -1,2 L -1,-2 Z
             M 3,0 L 2,1 L -2,1 L -3,0 L -2,-1 L 2,-1 Z
             M 2.1,2.1 L 1.4,2.8 L -1.4,0 L -0.7,-0.7 Z
             M 2.1,-2.1 L 1.4,-2.8 L -1.4,0 L -0.7,0.7 Z" 
          fill="none" stroke="#2C3E50" stroke-width="0.8"/>
  </g>
  
  <!-- Border -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" 
        fill="none" stroke="#000000" stroke-width="0.5" opacity="0.2"/>
</svg>
